name: Check Build

on:
  push:
    branches: 
      - feature/navigate-platform-enhancements
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run build
        id: build
        continue-on-error: true
        run: |
          npm run build 2>&1 | tee build-output.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
      
      - name: Extract build errors
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "# Build Status - $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)" > BUILD_STATUS.md
          echo "" >> BUILD_STATUS.md
          echo "## ❌ Build Failed" >> BUILD_STATUS.md
          echo "" >> BUILD_STATUS.md
          echo "### Type Errors:" >> BUILD_STATUS.md
          grep -E "Type error|error TS" build-output.log | head -20 >> BUILD_STATUS.md || echo "No TypeScript errors found" >> BUILD_STATUS.md
          echo "" >> BUILD_STATUS.md
          echo "### Full Error Summary:" >> BUILD_STATUS.md
          grep -A 5 "Failed to compile" build-output.log | head -30 >> BUILD_STATUS.md || echo "No compilation errors found" >> BUILD_STATUS.md
          echo "" >> BUILD_STATUS.md
          echo "---" >> BUILD_STATUS.md
          echo "*Auto-generated by GitHub Actions*" >> BUILD_STATUS.md
      
      - name: Create success status
        if: steps.build.outputs.exit_code == '0'
        run: |
          echo "# Build Status - $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)" > BUILD_STATUS.md
          echo "" >> BUILD_STATUS.md
          echo "## ✅ Build Succeeded" >> BUILD_STATUS.md
          echo "" >> BUILD_STATUS.md
          echo "All checks passed!" >> BUILD_STATUS.md
          echo "" >> BUILD_STATUS.md
          echo "---" >> BUILD_STATUS.md
          echo "*Auto-generated by GitHub Actions*" >> BUILD_STATUS.md
      
      - name: Commit build status
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add BUILD_STATUS.md || true
          git diff --staged --quiet || (git commit -m "chore: Update build status from GitHub Actions [skip ci]" && git push) || echo "Commit/push skipped"
      
      - name: Check build result
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "❌ Build failed! Check BUILD_STATUS.md for details."
          exit 1
